[book]
title = "theoryminer"
authors = ["Rasoul Norouzi"]
description = "Assemble theories from text: from PDFs to a causal map."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
site-url = "/theoryminer/"
git-repository-url = "https://github.com/rasoulnorouzi/theoryminer"
edit-url-template = "https://github.com/rasoulnorouzi/theoryminer/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true
