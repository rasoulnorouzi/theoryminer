name: Documentation

# Build the book in docs/ with mdBook and publish it with GitHub Pages:
# https://rasoulnorouzi.github.io/theoryminer/
# A push to main that changes the book, the package code (the docstrings) or the changelog starts it.
# This workflow never publishes to PyPI; publish.yml does that.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "theoryminer/**"
      - "CHANGELOG.md"
      - "tutorials/STRATEGIES.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time. A run that publishes is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"      # the version that the book was written and checked with

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      # The script reads the code with the ast module, so it needs no package install.
      - name: Write the reference pages from the docstrings
        run: python docs/make_api.py

      - name: Build the book
        run: mdbook build docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
