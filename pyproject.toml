[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "theoryminer"
version = "0.0.1"
description = "Assemble theories from text: extract cause-effect claims and harmonise their constructs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rasoul Norouzi" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.3",          # sklearn.cluster.HDBSCAN
    "nltk",
    "pdf-inspector",
    "torch",
    "transformers",
    "sentence-transformers",
]

[project.optional-dependencies]
umap = ["umap-learn"]               # clusterer(..., umap={...})
notebooks = ["pandas", "ipykernel"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["theoryminer*"]
