[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "theoryminer"
version = "0.2.1"
description = "Assemble theories from text: extract cause-effect claims and harmonise their constructs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rasoul Norouzi" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["causal extraction", "theory building", "social science", "NLP", "PDF", "ELSST", "DOI"]
# No "License ::" classifier: the licence is given above as an SPDX expression (PEP 639).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.3",          # sklearn.cluster.HDBSCAN
    "nltk",
    "pdf-inspector",
    "torch",
    "transformers",
    "sentence-transformers",
    "umap-learn",                 # clusterer(..., umap={...}); installed by default since 0.1.1
    "networkx",                   # save_map() writes the GraphML file; torch installs it too
    "tmsr-doi-downloader; python_version >= '3.11'",   # download_papers(): more sources; since 0.2.1
]

[project.optional-dependencies]
umap = ["umap-learn"]               # kept so that old commands like pip install "theoryminer[umap]" still work
notebooks = ["pandas", "ipykernel"]
download = ["tmsr-doi-downloader; python_version >= '3.11'"]   # kept so that old commands like pip install "theoryminer[download]" still work
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/rasoulnorouzi/theoryminer"
Repository = "https://github.com/rasoulnorouzi/theoryminer"
Tutorial = "https://github.com/rasoulnorouzi/theoryminer/blob/main/tutorials/TUTORIAL.ipynb"
Issues = "https://github.com/rasoulnorouzi/theoryminer/issues"
Changelog = "https://github.com/rasoulnorouzi/theoryminer/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["theoryminer*"]

# The ELSST thesaurus ships inside the package, so pip users need no extra file.
[tool.setuptools.package-data]
theoryminer = ["data/*"]

# A plain "pytest" runs the fast tests only. "pytest -m slow" runs the tests that download models.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads SocioCausaNet and a sentence-transformer (about 1 GB); run with: pytest -m slow"]
