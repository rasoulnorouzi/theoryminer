[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "theoryminer"
version = "0.0.1"
description = "Assemble theories from text: extract cause-effect claims and harmonise their constructs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rasoul Norouzi" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.3",          # sklearn.cluster.HDBSCAN
    "nltk",
    "pdf-inspector",
    "torch",
    "transformers",
    "sentence-transformers",
]

[project.optional-dependencies]
umap = ["umap-learn"]               # clusterer(..., umap={...})
notebooks = ["pandas", "ipykernel"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/rasoulnorouzi/theoryminer"

[tool.setuptools.packages.find]
include = ["theoryminer*"]

# The ELSST thesaurus ships inside the package, so pip users need no extra file.
[tool.setuptools.package-data]
theoryminer = ["data/*"]
